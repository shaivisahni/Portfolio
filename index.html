<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaivi Sahni | Computer Engineering, University of Waterloo</title>
<meta name="description" content="Portfolio of Shaivi Sahni: AI tools, embedded hardware, and game development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --chassis:#22272b; --chassis-hi:#3a4248; --chassis-lo:#15181b;
  --screen-off:#0b0d0f; --desk:#1b2328;
  --paper:#eae7e0; --paper-dim:#d8d4cb; --ink:#1d2225; --ink-soft:#5c6469;
  --rule:#b9b4a9; --amber:#e8a33d; --teal:#3f8f8a; --teal-deep:#2c6a66;
  --red:#d2604a;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --menubar-h:30px; --dock-h:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--chassis-lo);color:var(--paper);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   THE MACHINE / real 3D geometry.
   The hinge is the bottom edge of the lid and the top edge of
   the deck, so both halves pivot around the same line.
   ============================================================ */
#stage{height:300vh;position:relative}
#stage-pin{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse 68% 52% at 50% 62%,#2c3439 0%,#14171a 72%)}

.brandline{position:absolute;top:7vh;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:#6e7a81;
  margin:0;transition:opacity .4s ease}
.brandline b{color:var(--paper-dim);font-weight:500}

.scene{perspective:1900px;perspective-origin:50% 42%;transition:opacity .45s ease}
.laptop{width:min(64vw,680px,76vh);transform-style:preserve-3d;transform:rotateX(3deg) translateY(16%);
  position:relative;transition:transform .65s cubic-bezier(.4,0,.2,1)}

.lid{position:relative;aspect-ratio:16/10.2;
  transform-origin:bottom center;
  transform:rotateX(calc(-108deg + 108deg * var(--open,0)));
  transform-style:preserve-3d;
  background:linear-gradient(172deg,#454e55,#2a3136);
  border-radius:11px 11px 2px 2px;
  padding:11px 11px 26px;
  box-shadow:0 0 0 1px #0e1113;
}
.lid::before{
  content:'';position:absolute;inset:0;border-radius:11px 11px 2px 2px;
  background:linear-gradient(158deg,#525b62,#2b3237);
  transform:translateZ(-7px);box-shadow:0 0 0 1px #0e1113;
}
.webcam{position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:#0e1113;box-shadow:inset 0 0 0 1px #2c3439}
.webcam::after{content:'';position:absolute;inset:1.4px;border-radius:50%;background:#1c3a38}
.chin{position:absolute;bottom:7px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:9px;letter-spacing:.34em;color:#677178}
.hinge{position:absolute;left:8%;right:8%;bottom:-4px;height:8px;
  background:linear-gradient(180deg,#20262a,#0f1214);border-radius:4px;transform:translateZ(-3px)}

.screen{position:relative;height:100%;width:100%;background:var(--screen-off);
  border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px #050708}
.glare{position:absolute;inset:0;z-index:8;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.14) 0 24%,rgba(255,255,255,0) 43%);
  opacity:calc(1 - var(--open,0) * .84)}

.deck{position:relative;aspect-ratio:16/11.6;
  transform-origin:top center;transform:rotateX(73deg);
  background:linear-gradient(180deg,#9aa2a8,#767f86 46%,#616a71);
  border-radius:2px 2px 13px 13px;padding:5.5% 6% 4%;
  box-shadow:0 0 0 1px #383f45;
}
.deck::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:13%;height:4px;background:#4a5157;border-radius:3px}
.keys{display:grid;grid-template-rows:repeat(5,1fr);gap:1.7%;height:64%}
.krow{display:grid;gap:1.2%}
.krow>i{background:linear-gradient(180deg,#3d444a,#2b3136);border-radius:2px;
  box-shadow:inset 0 -1px 0 #1d2226,0 1px 0 rgba(255,255,255,.16)}
.trackpad{margin:4.5% auto 0;width:31%;height:23%;
  background:linear-gradient(180deg,#8d959b,#7d868c);border-radius:4px;
  box-shadow:inset 0 0 0 1px #5f686e}

.floorshadow{position:absolute;left:5%;right:5%;bottom:-30px;height:48px;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,0,0,.6),transparent 72%);
  filter:blur(8px);opacity:calc(.32 + var(--open,0) * .48);transform:translateZ(-40px)}

.scroll-cue{position:absolute;bottom:6vh;left:0;right:0;text-align:center;margin:0;
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;
  color:#5d666c;transition:opacity .35s ease}
.scroll-cue span{display:inline-block;animation:nudge 1.9s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

.crt-flash{position:absolute;inset:0;background:#e3ebe7;opacity:0;pointer-events:none;z-index:7}
.crt-flash.fire{animation:crtOn 640ms ease-out forwards}
@keyframes crtOn{
  0%{opacity:0;transform:scaleY(.004)}
  20%{opacity:.96;transform:scaleY(.007)}
  46%{opacity:.7;transform:scaleY(1)}
  100%{opacity:0;transform:scaleY(1)}
}
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px)}
.screen.dark .scanlines{opacity:0}

.boot{position:absolute;inset:0;padding:4.5% 5.5%;font-family:var(--mono);
  font-size:clamp(7px,1.05vw,12px);line-height:1.78;color:var(--amber);opacity:0;z-index:4;
  overflow:hidden}
.boot.on{opacity:1}
.boot .ok{color:var(--teal)}
.boot .dim{color:#8a6b34}
.boot .post{color:#c9d2d6}
.boot .rule{border-top:1px solid #4a3a1c;margin:.5em 0}
.bar{display:inline-block;width:46%;height:8px;border:1px solid var(--amber);vertical-align:-1px;margin-left:7px}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .18s linear}
.caret{display:inline-block;width:.55em;height:1em;background:currentColor;
  vertical-align:-2px;animation:blink 1.05s step-end infinite}
@keyframes blink{50%{opacity:0}}

.enter-prompt{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:rgba(11,13,15,.84)}
.enter-prompt.on{display:flex;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.enter-btn{font-family:var(--mono);font-size:clamp(10px,1.25vw,13px);letter-spacing:.2em;
  color:var(--screen-off);background:var(--amber);padding:10px 26px;border-radius:2px;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,163,61,.45)}60%{box-shadow:0 0 0 15px rgba(232,163,61,0)}}
.enter-hint{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#7d878d}

/* ============================================================
   DESKTOP OS
   ============================================================ */
#os{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:var(--desk);
  opacity:0;transform:scale(.93);
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
#os.mounted{display:flex}
#os.live{opacity:1;transform:scale(1)}
#wallpaper{position:absolute;inset:0;width:100%;height:100%;z-index:0}

.menubar{position:relative;z-index:40;height:var(--menubar-h);flex:0 0 auto;
  display:flex;align-items:center;gap:3px;padding:0 11px;
  background:rgba(20,25,28,.95);border-bottom:1px solid #0d1012;
  font-size:12.5px;color:var(--paper-dim);backdrop-filter:blur(6px)}
.menubar .mark{font-weight:600;color:var(--paper);letter-spacing:.02em;margin-right:14px}
.menubar button{padding:3px 8px;border-radius:3px;font-size:12.5px;color:var(--paper-dim)}
.menubar button:hover{background:#2f383d;color:var(--paper)}
.menubar .spacer{margin-left:auto}
.tray{display:flex;align-items:center;gap:11px;padding-left:6px}
.tray svg{width:15px;height:15px;color:#8e9aa0}
.tray .clock{font-family:var(--mono);font-size:12px;color:var(--paper-dim)}
.batt{position:relative;width:22px;height:11px;border:1px solid #8e9aa0;border-radius:2px}
.batt::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#8e9aa0;border-radius:0 1px 1px 0}
.batt i{position:absolute;inset:1.5px;width:72%;background:var(--teal);display:block}

.iconfield{position:relative;z-index:10;flex:1 1 auto;
  padding:18px 16px calc(var(--dock-h) + 92px) 16px;
  display:grid;grid-template-columns:repeat(auto-fill,96px);
  grid-auto-rows:min-content;gap:6px 4px;align-content:start}
.dicon{width:96px;padding:9px 4px 7px;border-radius:5px;text-align:center;color:var(--paper);
  opacity:0;transform:translateY(-8px)}
.dicon.in{animation:iconIn .5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes iconIn{to{opacity:1;transform:translateY(0)}}
.dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:rgba(63,143,138,.32);box-shadow:inset 0 0 0 1px var(--teal)}
.dicon .gl{display:block;margin:0 auto 6px;width:44px;height:38px}
.dicon .lbl{font-size:11.5px;line-height:1.3;word-break:break-word}
.dicon .cnt{font-family:var(--mono);font-size:9.5px;color:#93a0a6;display:block;margin-top:2px}

/* context menu */
.ctx{position:absolute;z-index:60;min-width:186px;padding:4px;
  background:rgba(28,35,39,.97);border:1px solid rgba(255,255,255,.13);border-radius:6px;
  box-shadow:0 14px 34px rgba(0,0,0,.55);display:none;animation:ctxIn .12s ease-out}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.ctx.on{display:block}
.ctx button{display:block;width:100%;text-align:left;padding:6px 11px;border-radius:4px;
  font-size:12.5px;color:var(--paper-dim)}
.ctx button:hover{background:var(--teal-deep);color:var(--paper)}
.ctx hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:4px 6px}

/* windows */
.win{position:absolute;z-index:20;background:var(--paper);color:var(--ink);
  border-radius:6px;border:1px solid #6f6a60;
  box-shadow:0 18px 44px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  display:flex;flex-direction:column;
  transform-origin:var(--ox,50%) var(--oy,50%);
  animation:winOpen .32s cubic-bezier(.15,.9,.25,1);max-width:calc(100vw - 24px)}
@keyframes winOpen{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.win.closing{animation:winShut .19s ease-in forwards}
@keyframes winShut{to{opacity:0;transform:scale(.78)}}
.win.minning{animation:winMin .34s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes winMin{to{opacity:0;transform:scale(.15) translateY(62vh)}}
.win.focused{box-shadow:0 24px 60px rgba(0,0,0,.62),0 0 0 1px var(--teal)}

.titlebar{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:grab;
  background:linear-gradient(180deg,var(--paper-dim),#cbc6bc);
  border-bottom:1px solid var(--rule);border-radius:5px 5px 0 0;user-select:none}
.titlebar:active{cursor:grabbing}
.tb-dots{display:flex;gap:6px;flex:0 0 auto}
.tb-dots i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.22)}
.tb-close{background:var(--red)}.tb-min{background:#d9a441}.tb-zoom{background:#7fae5c}
.tb-title{font-size:12.5px;font-weight:500;color:#3a4145;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-kind{font-family:var(--mono);font-size:10px;color:#7b756a;flex:0 0 auto}

.winbody{padding:16px 18px 20px;overflow-y:auto;flex:1 1 auto}
.winbody h2{font-size:17px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.winbody h3{font-size:13.5px;font-weight:600;margin:16px 0 6px}
.winbody p{font-size:13.5px;line-height:1.72;color:#333a3e;margin-bottom:11px;max-width:64ch}
.winbody .sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px}

.statusbar{flex:0 0 auto;padding:5px 10px;border-top:1px solid var(--rule);
  background:#dfdbd2;font-family:var(--mono);font-size:10px;color:#7b756a;
  display:flex;justify-content:space-between;border-radius:0 0 5px 5px}
.grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:3}
.grip::after{content:'';position:absolute;right:3px;bottom:3px;width:8px;height:8px;
  border-right:2px solid #9a948a;border-bottom:2px solid #9a948a}

.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px}
.fitem{padding:10px 4px 8px;border-radius:5px;text-align:center;color:var(--ink)}
.fitem:hover{background:rgba(63,143,138,.14)}
.fitem.sel{background:rgba(63,143,138,.26)}
.fitem .gl{width:40px;height:34px;margin:0 auto 5px;display:block}
.fitem .lbl{font-size:11.5px;line-height:1.3}
.fitem .cnt{display:block;font-family:var(--mono);font-size:9.5px;color:#7b756a;margin-top:2px}

.shot{width:100%;aspect-ratio:16/9;object-fit:cover;background:#c3bfb5;
  border:1px solid var(--rule);border-radius:4px;margin-bottom:13px;display:block}
.shot-fallback{width:100%;aspect-ratio:16/9;border:1px solid var(--rule);border-radius:4px;
  margin-bottom:13px;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,#d5d0c6 0 9px,#cfcabf 9px 18px);
  font-family:var(--mono);font-size:11px;color:#7b756a}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 15px}
.chip{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:2px;
  background:#dcd8cf;color:#4c545a;border:1px solid var(--rule)}
.wactions{display:flex;flex-wrap:wrap;gap:8px}
.wbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 14px;
  border-radius:3px;border:1px solid var(--teal-deep);color:var(--teal-deep);
  background:transparent;text-decoration:none;transition:background .15s,color .15s}
.wbtn:hover{background:var(--teal-deep);color:var(--paper)}
.wbtn.solid{background:var(--teal-deep);color:var(--paper)}
.wbtn.solid:hover{background:#20514e}
.wbtn:disabled{opacity:.55;cursor:default}
.wbtn svg{width:13px;height:13px;flex:0 0 auto}

.role .rt{font-size:15px;font-weight:600}
.role .rc{font-size:13px;color:var(--teal-deep);font-weight:500}
.role .rd{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:3px 0 10px}
.role ul{list-style:none;margin:0}
.role li{font-size:13px;line-height:1.62;padding-left:15px;position:relative;margin-bottom:5px;color:#333a3e}
.role li::before{content:'';position:absolute;left:0;top:8px;width:6px;height:1px;background:var(--teal)}
.win-note{background:#e0dcd2;border-left:2px solid var(--amber);padding:9px 12px;
  font-size:12.5px;color:#454c50;margin:10px 0 14px}

.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.skillgrid h3{margin:0 0 7px;font-size:12px;color:var(--teal-deep)}
.skillgrid ul{list-style:none}
.skillgrid li{font-size:12.5px;line-height:1.75;color:#333a3e}

/* contact + form */
.crow{display:flex;align-items:center;gap:11px;padding:8px 2px;border-bottom:1px solid var(--rule);
  text-decoration:none;color:var(--ink)}
.crow:hover .cval{text-decoration:underline}
.crow svg{width:16px;height:16px;color:var(--teal-deep);flex:0 0 auto}
.ckey{font-size:12.5px;width:62px;color:var(--ink-soft);flex:0 0 auto}
.cval{font-size:13px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px}
.field input,.field textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);
  background:#f4f2ed;border:1px solid var(--rule);border-radius:3px;padding:8px 10px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);
  box-shadow:0 0 0 2px rgba(63,143,138,.22)}
.field textarea{resize:vertical;min-height:78px;line-height:1.6}
.field.bad input,.field.bad textarea{border-color:var(--red)}
.err{font-size:11.5px;color:var(--red);margin-top:4px;display:none}
.field.bad .err{display:block}
.honey{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.formmsg{font-size:12.5px;padding:9px 12px;border-radius:3px;margin-top:11px;display:none}
.formmsg.ok{display:block;background:#dcece6;color:#1f5c50;border-left:2px solid var(--teal)}
.formmsg.no{display:block;background:#f3ded9;color:#8c3423;border-left:2px solid var(--red)}

.win.term{background:#12171a;border-color:#39434a}
.win.term .titlebar{background:linear-gradient(180deg,#2b3439,#212a2e);border-bottom-color:#39434a}
.win.term .tb-title,.win.term .tb-kind{color:#96a2a8}
.win.term .statusbar{background:#1b2226;border-top-color:#39434a;color:#6e7a80}
.termbody{padding:12px 14px 16px;font-family:var(--mono);font-size:12px;line-height:1.85;
  color:#9fb3a8;overflow-y:auto;flex:1}
.termbody .p{color:var(--teal)}.termbody .o{color:#d3ddd8}.termbody .a{color:var(--amber)}

.dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:35;
  height:var(--dock-h);display:flex;align-items:center;gap:5px;padding:0 9px;border-radius:9px;
  background:rgba(20,26,29,.84);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(9px);max-width:calc(100vw - 24px);overflow-x:auto}
.dock:empty{display:none}
.dockitem{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:5px;
  font-size:12px;color:var(--paper-dim);white-space:nowrap;
  animation:dockIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes dockIn{from{opacity:0;transform:translateY(12px) scale(.85)}to{opacity:1;transform:none}}
.dockitem:hover{background:rgba(255,255,255,.11);color:var(--paper)}
.dockitem svg{width:15px;height:15px;color:var(--teal)}

.toast{position:absolute;left:50%;bottom:calc(var(--dock-h) + 22px);transform:translateX(-50%);
  z-index:45;background:rgba(20,26,29,.94);border:1px solid rgba(255,255,255,.12);
  color:var(--paper-dim);font-size:12.5px;padding:9px 16px;border-radius:5px;
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ============================================================
   PLAIN PAGE / black and blue, scroll only
   ============================================================ */
#plain{
  display:none;min-height:100vh;
  --pg:#080b0f; --pg2:#101720; --pline:#1e2933;
  --ptx:#e7edf3; --pdim:#8d9caa; --pblue:#4d9bff; --pblue-dim:#2f6fd0;
  background:var(--pg);color:var(--ptx);
}
#plain.on{display:block}
.p-wrap{max-width:720px;margin:0 auto;padding:0 24px 120px}

.p-back{position:sticky;top:0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:13px 0;margin-bottom:54px;
  background:rgba(8,11,15,.92);border-bottom:1px solid var(--pline);
  backdrop-filter:blur(8px);font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;color:var(--pdim)}
.p-switch{font-family:var(--sans);font-size:12.5px;letter-spacing:0;padding:7px 14px;
  border-radius:6px;border:1px solid var(--pblue-dim);color:var(--pblue);background:transparent}
.p-switch:hover{background:var(--pblue-dim);color:#fff}

.p-hero{padding:14px 0 8px}
#plain h1{font-size:clamp(34px,7vw,54px);font-weight:600;letter-spacing:-.035em;
  line-height:1.04;margin-bottom:14px}
#plain h1 em{font-style:normal;color:var(--pblue)}
#plain .p-role{font-size:16px;color:var(--pdim);margin:0 0 26px;line-height:1.6;max-width:52ch}
#plain p{font-size:14.5px;line-height:1.8;margin-bottom:14px;max-width:66ch;color:#b9c6d2}

.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--pline);
  border:1px solid var(--pline);border-radius:10px;overflow:hidden;margin:30px 0 8px}
.p-stat{background:var(--pg2);padding:15px 16px}
.p-stat b{display:block;font-size:23px;font-weight:600;color:var(--pblue);line-height:1.1}
.p-stat span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--pdim);margin-top:5px}

#plain h2{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;
  font-weight:400;letter-spacing:.2em;color:var(--pblue);margin:64px 0 22px;
  padding:0;border:0}
#plain h2::after{content:'';flex:1;height:1px;background:var(--pline)}

.p-card{padding:20px 0 20px 22px;border:0;border-left:1px solid var(--pline);position:relative}
.p-card::before{content:'';position:absolute;left:-4px;top:26px;width:7px;height:7px;
  border-radius:50%;background:var(--pblue-dim);box-shadow:0 0 0 4px var(--pg)}
.p-card:hover::before{background:var(--pblue)}
.p-card h3{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--ptx)}
.p-card .p-meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--pdim);margin-bottom:10px}
.p-card p{font-size:14px;margin-bottom:10px;color:#a9b7c4}
.p-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.p-tag{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:11px;
  background:rgba(77,155,255,.1);border:1px solid rgba(77,155,255,.22);color:#9dc4f5}
.p-links{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.p-links a{color:var(--pblue);text-decoration:none;border-bottom:1px solid rgba(77,155,255,.3);
  padding-bottom:1px}
.p-links a:hover{border-bottom-color:var(--pblue)}

.p-form{max-width:460px;margin-top:6px}
.p-form .field label{color:var(--pdim);font-family:var(--mono);font-size:10px;letter-spacing:.12em}
.p-form .field input,.p-form .field textarea{background:var(--pg2);border:1px solid var(--pline);
  color:var(--ptx);border-radius:7px;padding:11px 13px;font-size:13.5px}
.p-form .field input::placeholder,.p-form .field textarea::placeholder{color:#5d6b78}
.p-form .field input:focus,.p-form .field textarea:focus{border-color:var(--pblue-dim);
  box-shadow:0 0 0 3px rgba(77,155,255,.14)}
.p-form .wbtn{border-color:var(--pblue-dim);color:var(--pblue)}
.p-form .wbtn:hover{background:var(--pblue-dim);color:#fff}
.p-form .wbtn.solid{background:var(--pblue-dim);color:#fff;border-color:var(--pblue-dim)}
.p-form .formmsg.ok{background:rgba(77,155,255,.1);color:#9dc4f5;border-left-color:var(--pblue)}
.p-form .formmsg.no{background:rgba(210,96,74,.12);color:#e6a294;border-left-color:var(--red)}
.p-foot{margin-top:70px;padding-top:22px;border-top:1px solid var(--pline);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:#5d6b78}

@media (max-width:820px){
  #stage{display:none}
  #os{display:none !important}
  #plain{display:block}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
/* ============================================================
   REFINEMENTS / window chrome, shelf, terminal REPL
   ============================================================ */
.win{
  background:#f2f0ea;border:1px solid rgba(0,0,0,.28);border-radius:9px;
  box-shadow:0 1px 1px rgba(0,0,0,.16),0 8px 16px rgba(0,0,0,.2),0 26px 54px rgba(0,0,0,.4);
}
.win.focused{box-shadow:0 1px 1px rgba(0,0,0,.2),0 10px 22px rgba(0,0,0,.28),0 34px 72px rgba(0,0,0,.5)}
.titlebar{
  padding:0 11px;height:36px;border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,#e6e2da,#d3cec4);
  border-bottom:1px solid #b3ada1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
}
.tb-dots i{width:12px;height:12px;border:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.tb-dots i:hover{filter:brightness(1.12)}
.tb-title{font-size:13px;font-weight:600;color:#2f3639;text-align:center;letter-spacing:-.005em}
.tb-kind{font-size:10px;letter-spacing:.06em;color:#8a8478}

.wintop{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:7px 14px;background:#e9e6df;border-bottom:1px solid #cdc7bb;
  font-family:var(--mono);font-size:10.5px;color:#7b756a;
}
.wintop .crumb{color:var(--teal-deep)}

.winbody{padding:20px 22px 24px;background:#f2f0ea}
.winbody h2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:4px}
.winbody h2+.sub{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #ddd8ce}
.winbody h3{font-size:12px;font-weight:600;color:var(--teal-deep);margin:20px 0 8px}
.winbody p{font-size:13.5px;line-height:1.78;color:#3a4145}
.shot{border-radius:5px;border-color:#cdc7bb;margin-bottom:16px}
.shot-fallback{border-radius:5px;border-color:#cdc7bb;margin-bottom:16px}
.chip{background:#e5e1d8;border-color:#cdc7bb;color:#5a625f;border-radius:10px;padding:3px 10px}
.wbtn{border-radius:5px;padding:8px 15px;font-weight:500;border-width:1px}
.wbtn.solid{border-color:var(--teal-deep)}
.statusbar{background:#e6e2da;border-top:1px solid #cdc7bb;padding:6px 12px;border-radius:0 0 8px 8px}
.win-note{background:#ece7db;border-left:3px solid var(--amber);border-radius:0 3px 3px 0;padding:10px 13px}
.crow{padding:10px 2px;border-bottom-color:#ddd8ce}
.field input,.field textarea{background:#fbfaf7;border-color:#cdc7bb;border-radius:5px;padding:9px 11px}
.formmsg{border-radius:4px}

/* bottom shelf */
.shelf{
  position:absolute;left:14px;bottom:calc(var(--dock-h) + 16px);z-index:12;
  display:flex;gap:2px;align-items:flex-end;
}
.shelf .dicon{width:86px}
.shelf .dicon .gl{width:38px;height:33px}
.shelf .dicon .lbl{font-size:11px}

/* menubar view toggle + power */
.segmented{display:flex;background:rgba(255,255,255,.08);border-radius:5px;padding:2px;gap:2px}
.segmented button{padding:3px 11px;border-radius:4px;font-size:12px;color:#9aa5ab}
.segmented button.on{background:var(--teal-deep);color:var(--paper)}
.segmented button:hover{color:var(--paper)}
.powerbtn{display:flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:4px}
.powerbtn svg{width:14px;height:14px}
.powerbtn:hover{background:var(--red);color:#fff}

/* terminal REPL */
.termbody{font-size:12.5px;line-height:1.8}
.termhint{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.termhint button{font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:11px;
  border:1px solid #35434a;color:#8fa8a0;background:rgba(63,143,138,.09)}
.termhint button:hover{background:var(--teal-deep);color:#eaf2ef;border-color:var(--teal-deep)}
.termline{display:flex;align-items:baseline;gap:7px}
.terminput{flex:1;background:none;border:none;outline:none;font:inherit;color:#d3ddd8;padding:0;
  caret-color:var(--amber)}
.termout{white-space:pre-wrap;margin-bottom:9px}
.termout b{color:var(--amber);font-weight:500}
.termerr{color:#e08b7a}

/* ============================================================
   CARD VISUALS
   ============================================================ */
.phero{position:relative;margin:-20px -22px 18px;height:150px;overflow:hidden;
  background:var(--c,#3f8f8a);border-bottom:1px solid rgba(0,0,0,.2)}
.phero img{width:100%;height:100%;object-fit:cover;display:block}
.phero.noimg{background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 12px,transparent 12px 24px),var(--c,#3f8f8a)}
.phero.noimg::after{content:attr(data-mono);position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;
  letter-spacing:.2em;color:rgba(255,255,255,.8)}
.ptag{position:absolute;left:12px;top:12px;z-index:2;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;padding:4px 10px;border-radius:11px;
  background:rgba(12,15,17,.7);color:#fff;backdrop-filter:blur(4px)}
.pbar{height:3px;background:var(--c,#3f8f8a);margin:-18px -22px 18px}

.tilerow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:0 0 18px}
.tile{background:#e9e6df;border-radius:7px;padding:10px 12px;border-left:3px solid var(--c,#3f8f8a)}
.tile b{display:block;font-size:13.5px;font-weight:600;color:#2f3639;line-height:1.3}
.tile span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:#8a8478;margin-top:3px}

.chip.tinted{background:color-mix(in srgb, var(--c,#3f8f8a) 16%, #eeece6);
  border-color:color-mix(in srgb, var(--c,#3f8f8a) 34%, #ddd8ce);color:#42484c}

.avatar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar .ring{width:52px;height:52px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(140deg,var(--teal),#2c6a66);color:#f2f0ea;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.avatar .who h2{margin-bottom:2px}
.avatar .who p{font-size:12px;color:var(--ink-soft);margin:0}

.fitem .dot{display:block;width:7px;height:7px;border-radius:50%;margin:0 auto 5px}
/* ============================================================
   LITTLE APPS
   ============================================================ */
.appwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.appbar{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.appbar .score{font-family:var(--mono);font-size:12px;color:#5c6469}
.appbar .score b{color:var(--teal-deep);font-size:14px}
.appbtn{font-size:12px;padding:5px 12px;border-radius:5px;border:1px solid #c2bcb0;
  color:#4c545a;background:#e9e6df}
.appbtn:hover{background:var(--teal-deep);color:var(--paper);border-color:var(--teal-deep)}
.snakebox{position:relative;border-radius:8px;overflow:hidden;background:#1a2226;
  box-shadow:inset 0 0 0 1px #38424a}
.snakebox canvas{display:block}
.snakeover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;background:rgba(12,17,20,.86);color:#eae7e0;
  font-family:var(--mono);font-size:13px}
.snakeover.on{display:flex}
.padwrap{display:flex;flex-direction:column;height:100%;gap:9px}
.padwrap textarea{flex:1;width:100%;font-family:var(--mono);font-size:13px;line-height:1.75;
  color:#2f3639;background:#fbfaf7;border:1px solid #cdc7bb;border-radius:6px;padding:12px 14px;
  resize:none}
.padwrap textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px rgba(63,143,138,.2)}
.padfoot{display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:10.5px;color:#8a8478}
.paintbox{border-radius:8px;overflow:hidden;border:1px solid #cdc7bb;background:#fbfaf7;
  touch-action:none;width:100%}
.paintbox canvas{display:block;width:100%;cursor:crosshair}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw.on{border-color:#2f3639}

let booted = false, entered = false;

function runBoot(){
  if(booted) return; booted = true;
  screen.classList.remove('dark');
  flash.classList.add('fire');
  bootEl.classList.add('on');
  if(reduced){
    bootEl.innerHTML = BOOT.map(l => '<div>' + l.t + '</div>').join('');
    prompt.classList.add('on'); return;
  }
  let i = 0;
  const next = () => {
    if(i >= BOOT.length){
      bootEl.insertAdjacentHTML('beforeend','<div><span class="caret"></span></div>');
      setTimeout(()=>prompt.classList.add('on'), 400);
      return;
    }
    const line = BOOT[i++];
    bootEl.insertAdjacentHTML('beforeend','<div>' + line.t + '</div>');
    if(line.bar){
      const fill = bootEl.querySelector('#memBar i');
      let mb = 0;
      const step = setInterval(()=>{
        mb += 2048;
        fill.style.width = Math.min(100, mb / 163.84) + '%';
        if(mb >= 16384) clearInterval(step);
      }, 140);
    }
    setTimeout(next, line.d);
  };
  setTimeout(next, 460);
}

/* ---------- scroll opens the lid ---------- */
function onScroll(){
  if(entered) return;
  const total = stage.offsetHeight - window.innerHeight;
  const p = total > 0 ? Math.min(Math.max(window.scrollY / total, 0), 1) : 1;
  const open = Math.min(p / 0.62, 1);
  laptop.style.setProperty('--open', open.toFixed(4));
  cue.style.opacity = String(Math.max(0, 1 - open * 2.4));
  if(open > 0.985) runBoot();
  else if(booted && open < 0.72) powerOff();
}

/* scrolling back up closes the lid and switches the screen off,
   so it boots fresh the next time you scroll down */
function powerOff(){
  booted = false;
  screen.classList.add('dark');
  bootEl.classList.remove('on');
  bootEl.innerHTML = '';
  flash.classList.remove('fire');
  prompt.classList.remove('on');
}
if(reduced){
  laptop.style.setProperty('--open','1');
  runBoot();
}else{
  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);
  onScroll();
}

  w.el.classList.add('closing');
  setTimeout(()=>{ w.el.remove(); openWins.delete(w.id); }, 190);
  if(w.dockEl){ w.dockEl.remove(); w.dockEl = null; }
}
function minimizeWin(w){
  w.el.classList.add('minning');
  setTimeout(()=>{ w.el.style.display = 'none'; w.el.classList.remove('minning'); }, 340);
  if(w.dockEl) return;
  const b = document.createElement('button');
  b.className = 'dockitem'; b.type = 'button';
  b.innerHTML = IC.win + '<span>' + esc(w.title) + '</span>';
  b.addEventListener('click', ()=>{
    w.el.style.display = 'flex'; focusWin(w); b.remove(); w.dockEl = null;
  });
  dock.appendChild(b); w.dockEl = b;
}

function openWindow(o){
  const has = openWins.get(o.id);
  if(has){
    has.el.style.display = 'flex';
    if(has.dockEl){ has.dockEl.remove(); has.dockEl = null; }
    focusWin(has); return has;
  }
  const w = Math.min(o.w || 520, window.innerWidth - 40);
  const h = Math.min(o.h || 420, window.innerHeight - 110);
  const step = (cascade++ % 6) * 27;
  const left = Math.max(14, Math.min(window.innerWidth - w - 14, 158 + step));
  const top  = Math.max(40, Math.min(window.innerHeight - h - 70, 60 + step));

  const el = document.createElement('section');
  el.className = 'win' + (o.term ? ' term' : '');
  el.style.cssText = 'left:'+left+'px;top:'+top+'px;width:'+w+'px;height:'+h+'px;z-index:'+(++z);
  if(o.origin){
    el.style.setProperty('--ox', (o.origin.x + o.origin.width/2 - left) + 'px');
    el.style.setProperty('--oy', (o.origin.y + o.origin.height/2 - top) + 'px');
  }
  el.setAttribute('role','dialog'); el.setAttribute('aria-label', o.title);
  el.innerHTML =
    '<header class="titlebar"><span class="tb-dots">' +
      '<i class="tb-close" role="button" tabindex="0" aria-label="Close"></i>' +
      '<i class="tb-min" role="button" tabindex="0" aria-label="Minimise"></i>' +
      '<i class="tb-zoom" role="button" tabindex="0" aria-label="Zoom"></i>' +
    '</span><span class="tb-title">' + esc(o.title) + '</span>' +
    '<span class="tb-kind">' + esc(o.kind || '') + '</span></header>' +
    (o.top ? '<div class="wintop">' + o.top + '</div>' : '') +
    '<div class="' + (o.term ? 'termbody' : 'winbody') + '">' + o.html + '</div>' +
    '<footer class="statusbar"><span>' + esc(o.status || o.kind || '') + '</span><span>' + esc(o.status2 || '') + '</span></footer>' +
    '<div class="grip" aria-hidden="true"></div>';

  os.appendChild(el);
  const win = { id:o.id, el:el, title:o.title, dockEl:null, base:{w:w,h:h,left:left,top:top} };
  openWins.set(o.id, win);
  focusWin(win);

  el.addEventListener('pointerdown', ()=>focusWin(win));
  el.querySelector('.tb-close').addEventListener('click', e=>{ e.stopPropagation(); closeWin(win); });
  el.querySelector('.tb-min').addEventListener('click', e=>{ e.stopPropagation(); minimizeWin(win); });
  el.querySelector('.tb-zoom').addEventListener('click', e=>{ e.stopPropagation(); zoomWin(win); });
  drag(el, el.querySelector('.titlebar'));
  resize(el, el.querySelector('.grip'));
  wire(el);
  if(o.onMount) o.onMount(el);
  return win;
}

function zoomWin(w){
  const el = w.el, b = w.base, big = el.dataset.zoom === '1';
  el.style.transition = 'width .24s ease,height .24s ease,left .24s ease,top .24s ease';
  if(big){
    el.style.width = b.w+'px'; el.style.height = b.h+'px';
    el.style.left = b.left+'px'; el.style.top = b.top+'px'; el.dataset.zoom = '0';
  }else{
    el.style.width = (window.innerWidth-40)+'px';
    el.style.height = (window.innerHeight-110)+'px';
    el.style.left = '20px'; el.style.top = '44px'; el.dataset.zoom = '1';
  }
  setTimeout(()=>{ el.style.transition = ''; }, 270);
}
function drag(el, handle){
  let sx=0,sy=0,ox=0,oy=0,on=false;
  handle.addEventListener('pointerdown', e => {
    if(e.target.closest('.tb-dots')) return;
    on = true; sx=e.clientX; sy=e.clientY;
    ox=parseFloat(el.style.left); oy=parseFloat(el.style.top);
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if(!on) return;
    el.style.left = Math.max(-40, Math.min(window.innerWidth-80, ox+e.clientX-sx)) + 'px';
    el.style.top  = Math.max(32, Math.min(window.innerHeight-46, oy+e.clientY-sy)) + 'px';
  });
  const off = e => { if(on){ on=false; try{handle.releasePointerCapture(e.pointerId);}catch(_){} } };
  handle.addEventListener('pointerup', off);
  handle.addEventListener('pointercancel', off);
}
function resize(el, grip){
  let sx=0,sy=0,ow=0,oh=0,on=false;
  grip.addEventListener('pointerdown', e => {
    e.stopPropagation(); on=true; sx=e.clientX; sy=e.clientY;
    ow=el.offsetWidth; oh=el.offsetHeight; grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', e => {
    if(!on) return;
    el.style.width  = Math.max(280, Math.min(window.innerWidth-40,  ow+e.clientX-sx)) + 'px';
    el.style.height = Math.max(180, Math.min(window.innerHeight-70, oh+e.clientY-sy)) + 'px';
  });
  const off = e => { if(on){ on=false; try{grip.releasePointerCapture(e.pointerId);}catch(_){} } };
  grip.addEventListener('pointerup', off);
  grip.addEventListener('pointercancel', off);
}
function wire(root){
  root.querySelectorAll('[data-open]').forEach(b => {
    let last = 0;
    const go = () => route(b.dataset.open, b.getBoundingClientRect());
    if(b.classList.contains('fitem')){
      b.addEventListener('click', () => {
        root.querySelectorAll('.fitem').forEach(o=>o.classList.remove('sel'));
        b.classList.add('sel');
        const now = Date.now();
        if(now - last < 420) go();
        last = now;
      });
      b.addEventListener('dblclick', go);
    }else{
      b.addEventListener('click', go);
    }
  });
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 3200);
}

function bindForm(root){
  const form = root.querySelector('.cform');
  if(!form || form.dataset.bound) return;
  form.dataset.bound = '1';
  const btn = form.querySelector('[data-send]');
  const msg = form.querySelector('.formmsg');
  const fields = [...form.querySelectorAll('.field')];
  fields.forEach(f => f.querySelector('input,textarea')
    .addEventListener('input', ()=>f.classList.remove('bad')));

  btn.addEventListener('click', async () => {
    const val = n => form.querySelector('[name="'+n+'"]').value.trim();
    const name = val('name'), email = val('email'), body = val('message');
    let bad = false;
    const mark = (i, cond) => { fields[i].classList.toggle('bad', cond); if(cond) bad = true; };
    mark(0, !name);
    mark(1, !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
    mark(2, body.length < 4);
    msg.className = 'formmsg';
    if(bad) return;

    if(!CONTACT_FORM.endpoint){

      const bd  = encodeURIComponent(body + '\n\nFrom ' + name + ' (' + email + ')');

      msg.textContent = 'Opening your mail app with the message ready to send.';
      return;

    btn.disabled = true; btn.textContent = 'Sending…';
    try{
      const payload = { name:name, email:email, message:body,
        subject:'Portfolio message from ' + name };
      if(CONTACT_FORM.accessKey) payload.access_key = CONTACT_FORM.accessKey;
      const res = await fetch(CONTACT_FORM.endpoint, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('status ' + res.status);
      msg.className = 'formmsg ok';

      btn.disabled = false; btn.innerHTML = IC.send + 'Send message';
    }
  });
}

/* ---------- terminal: a REPL that answers questions ---------- */
const PROMPT = '<span class="p">shaivi@waterloo</span>:<span class="a">~</span>$ ';

function termAnswer(raw){
  const q = raw.toLowerCase().trim();
  if(!q) return null;
  if(q === 'clear' || q === 'cls') return { clear:true };
  if(q === 'help' || q === '?' || q === 'commands')
    return { text:'  Ask a question in plain English. For example:\n' +
      TERMINAL_QA.map(k=>'    ' + k.ask).join('\n') +
      '\n\n  Or type clear to wipe the screen.' };
  let best = null, score = 0;
  TERMINAL_QA.forEach(k => {
    const hits = k.keys.filter(w => q.indexOf(w) !== -1).length;
    if(hits > score){ score = hits; best = k; }
  });
  if(best) return { text:best.say() };
  return { text:"  I don't have an answer for that one. Try:\n" +
    TERMINAL_QA.slice(0,4).map(k=>'    ' + k.ask).join('\n'), err:true };
}

function openTerminal(origin){
  const w = openWindow({ id:'terminal', title:'Terminal', kind:'tty', term:true,
    w:520, h:360, origin:origin, html:'', status:'ask me anything', status2:'type help' });
  const body = w.el.querySelector('.termbody');
  if(body.dataset.ran) return w; body.dataset.ran = '1';

  body.innerHTML =
    '<div class="termout">Ask about the work, the roles, the stack, in plain English.\n' +
    'Click a question or type your own.</div>' +
    '<div class="termhint">' + TERMINAL_QA.slice(0,5).map((k,i) =>
      '<button type="button" data-q="' + i + '">' + esc(k.ask) + '</button>').join('') + '</div>' +
    '<div id="termLog"></div>' +
    '<div class="termline">' + PROMPT +
      '<input class="terminput" id="termIn" autocomplete="off" spellcheck="false" ' +
      'aria-label="Terminal input" placeholder="what roles have you had?"></div>';

  const log = body.querySelector('#termLog');
  const input = body.querySelector('#termIn');

  function print(cmd, res){
    log.insertAdjacentHTML('beforeend', '<div>' + PROMPT + '<span class="o">' + esc(cmd) + '</span></div>');
    if(res && res.text)
      log.insertAdjacentHTML('beforeend',
        '<div class="termout' + (res.err ? ' termerr' : '') + '">' + esc(res.text) + '</div>');
    body.scrollTop = body.scrollHeight;
  }
  function run(cmd){
    const res = termAnswer(cmd);
    if(!res) return;
    if(res.clear){ log.innerHTML = ''; return; }
    print(cmd, res);
  }
  body.querySelectorAll('[data-q]').forEach(b =>
    b.addEventListener('click', () => {
      const k = TERMINAL_QA[+b.dataset.q];
      input.value = '';
      run(k.ask);
      input.focus();
    }));
  input.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    const v = input.value;
    input.value = '';
    run(v);
  });
  body.addEventListener('click', e => { if(!e.target.closest('button')) input.focus(); });
  setTimeout(()=>input.focus(), 340);
  return w;
}


/* ---------- little apps ---------- */
function openSnake(origin){
  const N = 15, CELL = 18, SIZE = N * CELL;
  const html =
    '<div class="appwrap"><div class="appbar">' +
      '<span class="score">score <b id="snScore">0</b></span>' +
      '<span class="score" style="margin-left:auto">best <b id="snBest">0</b></span>' +
      '<button class="appbtn" id="snNew" type="button">New game</button></div>' +
    '<div class="snakebox"><canvas id="snCv" width="' + SIZE + '" height="' + SIZE + '"></canvas>' +
      '<div class="snakeover on" id="snOver"><span id="snMsg">arrow keys or WASD</span>' +
      '<button class="appbtn" id="snGo" type="button">Start</button></div></div></div>';

  return openWindow({ id:'snake', title:'Snake', kind:'game',
    w:SIZE + 60, h:SIZE + 150, origin:origin, html:html,
    status:'a break from reading', status2:'arrows / wasd',
    onMount(el){
      const cv = el.querySelector('#snCv'), ctx = cv.getContext('2d');
      const over = el.querySelector('#snOver'), msg = el.querySelector('#snMsg');
      const scoreEl = el.querySelector('#snScore'), bestEl = el.querySelector('#snBest');
      let snake, dir, next, food, timer, score = 0, best = 0, alive = false;

      function place(){
        do{ food = { x:(Math.random()*N)|0, y:(Math.random()*N)|0 }; }
        while(snake.some(s => s.x === food.x && s.y === food.y));
      }
      function reset(){
        snake = [{x:7,y:7},{x:6,y:7},{x:5,y:7}];
        dir = {x:1,y:0}; next = dir; score = 0; scoreEl.textContent = '0';
        place(); alive = true; over.classList.remove('on');
        clearInterval(timer); timer = setInterval(step, 118);
        draw();
      }
      function stop(text){
        alive = false; clearInterval(timer);
        best = Math.max(best, score); bestEl.textContent = best;
        msg.textContent = text; over.classList.add('on');
      }
      function step(){
        dir = next;
        const head = { x:snake[0].x + dir.x, y:snake[0].y + dir.y };
        if(head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
           snake.some(s => s.x === head.x && s.y === head.y)) return stop('score ' + score);
        snake.unshift(head);
        if(head.x === food.x && head.y === food.y){
          score++; scoreEl.textContent = score; place();
        }else snake.pop();
        draw();
      }
      function draw(){
        ctx.fillStyle = '#1a2226'; ctx.fillRect(0,0,SIZE,SIZE);
        ctx.fillStyle = 'rgba(255,255,255,.035)';
        for(let i=0;i<N;i++) for(let j=0;j<N;j++)
          if((i+j)%2) ctx.fillRect(i*CELL, j*CELL, CELL, CELL);
        ctx.fillStyle = '#e8a33d';
        ctx.fillRect(food.x*CELL+4, food.y*CELL+4, CELL-8, CELL-8);
        snake.forEach((sg,i) => {
          ctx.fillStyle = i === 0 ? '#5dcaa5' : '#3f8f8a';
          ctx.fillRect(sg.x*CELL+1.5, sg.y*CELL+1.5, CELL-3, CELL-3);
        });
      }
      const KEYS = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
                     w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
      const onKey = e => {
        if(!document.body.contains(el)){ document.removeEventListener('keydown', onKey); return; }
        if(el.style.display === 'none') return;
        const k = KEYS[e.key] || KEYS[(e.key||'').toLowerCase()];
        if(!k) return;
        e.preventDefault();
        if(!alive){ reset(); return; }
        if(k[0] === -dir.x && k[1] === -dir.y) return;
        next = { x:k[0], y:k[1] };
      };
      document.addEventListener('keydown', onKey);
      el.querySelector('#snGo').addEventListener('click', reset);
      el.querySelector('#snNew').addEventListener('click', reset);
      ctx.fillStyle = '#1a2226'; ctx.fillRect(0,0,SIZE,SIZE);
    }
  });
}

function openNotepad(origin){
  const html =
    '<div class="padwrap"><textarea id="padTx" spellcheck="false" ' +
      'placeholder="Scratch space. Leave a note, draft a message, work something out."></textarea>' +
    '<div class="padfoot"><span id="padCount">0 characters</span>' +
      '<span>nothing here is saved</span></div></div>';
  return openWindow({ id:'notepad', title:'Notepad', kind:'text',
    w:420, h:340, origin:origin, html:html, status:'untitled.txt', status2:'not saved',
    onMount(el){
      const tx = el.querySelector('#padTx'), c = el.querySelector('#padCount');
      tx.addEventListener('input', ()=>{
        c.textContent = tx.value.length + ' character' + (tx.value.length === 1 ? '' : 's');
      });
      setTimeout(()=>tx.focus(), 320);
    }
  });
}

function openPaint(origin){
  const COLORS = ['#2f3639','#3f8f8a','#e8a33d','#d85a30','#378add'];
  const html =
    '<div class="appwrap"><div class="appbar">' +
      '<span class="swatches" id="pnSw">' + COLORS.map((c,i) =>
        '<button class="sw' + (i===0?' on':'') + '" type="button" data-c="' + c +
        '" style="background:' + c + '" aria-label="colour"></button>').join('') + '</span>' +
      '<button class="appbtn" id="pnClear" type="button" style="margin-left:auto">Clear</button>' +
    '</div><div class="paintbox"><canvas id="pnCv" width="720" height="440"></canvas></div></div>';
  return openWindow({ id:'paint', title:'Sketch', kind:'canvas',
    w:460, h:400, origin:origin, html:html, status:'draw with the mouse', status2:'not saved',
    onMount(el){
      const cv = el.querySelector('#pnCv'), ctx = cv.getContext('2d');
      let colour = COLORS[0], drawing = false;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 5;
      const pos = e => {
        const r = cv.getBoundingClientRect();
        return { x:(e.clientX - r.left) * (cv.width / r.width),
                 y:(e.clientY - r.top) * (cv.height / r.height) };
      };
      cv.addEventListener('pointerdown', e => {
        e.stopPropagation(); drawing = true;
        const q = pos(e); ctx.strokeStyle = colour;
        ctx.beginPath(); ctx.moveTo(q.x, q.y);
        cv.setPointerCapture(e.pointerId);
      });
      cv.addEventListener('pointermove', e => {
        if(!drawing) return;
        const q = pos(e); ctx.lineTo(q.x, q.y); ctx.stroke();
      });
      const off = e => { if(drawing){ drawing = false; try{ cv.releasePointerCapture(e.pointerId); }catch(_){} } };
      cv.addEventListener('pointerup', off);
      cv.addEventListener('pointercancel', off);
      el.querySelectorAll('#pnSw .sw').forEach(b => b.addEventListener('click', () => {
        colour = b.dataset.c;
        el.querySelectorAll('#pnSw .sw').forEach(o=>o.classList.remove('on'));
        b.classList.add('on');
      }));
      el.querySelector('#pnClear').addEventListener('click', ()=>ctx.clearRect(0,0,cv.width,cv.height));
    }
  });
}

/* ---------- routing ---------- */
function route(target, origin){
  if(target.indexOf('p:') === 0){
    const p = PROJECTS.find(x=>x.id===target.slice(2));
    if(p) openWindow({ id:'p:'+p.id, title:p.name, kind:'project', w:480, h:560,
      origin:origin, html:projectHTML(p), status:p.folder, status2:p.tech.length + ' tools',
      top:'~/<span class="crumb">' + esc(p.folder) + '</span>/' + esc(p.name) });
    return;
  }
  if(target.indexOf('r:') === 0){
    const r = EXPERIENCE.find(x=>x.id===target.slice(2));
    if(r) openWindow({ id:'r:'+r.id, title:r.title, kind:'record', w:470, h:420,
      origin:origin, html:roleHTML(r), status:r.dates });
    return;
  }
  if(target.indexOf('url:') === 0){
    const sc = SHORTCUTS.find(x=>x.id===target.slice(4));
    if(sc) window.open(sc.url, '_blank', 'noopener');
    return;
  }
  if(target.indexOf('f:') === 0){
    const f = FOLDERS.find(x=>x.id===target.slice(2));
    if(!f) return;
    const n = f.kind === 'roles' ? EXPERIENCE.length : PROJECTS.filter(p=>p.folder===f.id).length;
    openWindow({ id:'f:'+f.id, title:f.name, kind:'folder', w:420, h:310,
      origin:origin, html:folderHTML(f), status:n + ' items',
      status2:'double-click to open',
      top:'~/<span class="crumb">' + esc(f.id) + '</span>' });
    return;
  }
  if(target === 'terminal'){ openTerminal(origin); return; }
  if(target === 'snake'){ openSnake(origin); return; }
  if(target === 'notepad'){ openNotepad(origin); return; }
  if(target === 'paint'){ openPaint(origin); return; }
  const map = {
    about:   { title:'About me.txt', kind:'text',   w:520, h:410, html:aboutHTML,   st:'plain text' },
    skills:  { title:'Skills',       kind:'index',  w:560, h:420, html:skillsHTML,  st:'index' },
    contact: { title:'Contact',      kind:'card',   w:440, h:520, html:contactHTML, st:'address book' },
    resume:  { title:'Resume.pdf',   kind:'pdf',    w:430, h:260, html:resumeHTML,  st:'document' },
    trash:   { title:'Trash',        kind:'folder', w:430, h:300, html:trashHTML,   st:'1 item' },
    education:{title:'Education',    kind:'record', w:470, h:360, html:educationHTML, st:EDUCATION.school }
  };
  const m = map[target];
  if(!m) return;
  const win = openWindow({ id:target, title:m.title, kind:m.kind, w:m.w, h:m.h,
    origin:origin, html:m.html(), status:m.st });
  if(target === 'contact') bindForm(win.el);
}

/* ---------- desktop ---------- */
function makeIcon(ic, i, host){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'dicon';
  b.style.animationDelay = (reduced ? 0 : 80 + i*48) + 'ms';
  b.innerHTML = ic.glyph + '<span class="lbl">' + esc(ic.label) +
    (ic.count ? '<span class="cnt">' + esc(ic.count) + '</span>' : '') + '</span>';
  let last = 0;
  const open = () => route(ic.t, b.getBoundingClientRect());
  b.addEventListener('click', () => {
    document.querySelectorAll('.dicon').forEach(o=>o.classList.remove('sel'));
    b.classList.add('sel');
    const now = Date.now();
    if(now - last < 420) open();
    last = now;
  });
  b.addEventListener('dblclick', open);
  b.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); open(); } });
  host.appendChild(b);
  requestAnimationFrame(()=>b.classList.add('in'));
}

function buildDesktop(){
  const field = $('#iconfield');
  if(field.dataset.built) return; field.dataset.built = '1';

  const main = [
    { t:'about',     glyph:G.doc,  label:'About me.txt' },
    { t:'education', glyph:G.cap,  label:'Education' },
    { t:'resume',    glyph:G.pdf,  label:'Resume.pdf' }
  ];
  FOLDERS.forEach(f => main.push({
    t:'f:'+f.id, glyph:G.folder, label:f.name,
    count:(f.kind === 'roles' ? EXPERIENCE.length : PROJECTS.filter(p=>p.folder===f.id).length) + ' items'
  }));
  main.push({ t:'skills', glyph:G.list, label:'Skills' });
  main.forEach((ic,i)=>makeIcon(ic, i, field));

  const shelf = $('#shelf');
  const bottom = [
    { t:'terminal', glyph:G.term,  label:'Terminal' },
    { t:'contact',  glyph:G.mail,  label:'Contact' },
    { t:'snake',    glyph:G.snake, label:'Snake' },
    { t:'notepad',  glyph:G.pad,   label:'Notepad' },
    { t:'paint',    glyph:G.paint, label:'Sketch' }
  ];
  SHORTCUTS.forEach(sc => bottom.push({ t:'url:'+sc.id, glyph:G.link, label:sc.label }));
  bottom.push({ t:'trash', glyph:G.trash, label:'Trash' });
  bottom.forEach((ic,i)=>makeIcon(ic, main.length + i, shelf));

  setTimeout(()=>{
    route('about', field.firstChild.getBoundingClientRect());
    setTimeout(()=>toast('Double-click an icon to open it. The Terminal answers questions.'), 800);
  }, reduced ? 0 : 850);
}

/* ---------- right-click menu ---------- */
const ctx = $('#ctx');
os.addEventListener('contextmenu', e => {
  if(e.target.closest('.win')) return;
  e.preventDefault();
  ctx.innerHTML =
    '<button type="button" data-go="about">Open About me.txt</button>' +
    '<button type="button" data-go="f:roles">Open Experience</button>' +
    '<button type="button" data-go="contact">Open Contact</button>' +
    '<button type="button" data-go="terminal">Open Terminal</button>' +
    '<hr>' +
    '<button type="button" data-go="__tile">Tidy all windows</button>' +
    '<button type="button" data-go="__close">Close all windows</button>';
  ctx.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
  ctx.style.top  = Math.min(e.clientY, window.innerHeight - 190) + 'px';
  ctx.classList.add('on');
  ctx.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const g = b.dataset.go;
    ctx.classList.remove('on');
    if(g === '__close'){ [...openWins.values()].forEach(closeWin); return; }
    if(g === '__tile'){
      let i = 0;
      openWins.forEach(w => {
        w.el.style.transition = 'left .28s ease,top .28s ease';
        w.el.style.left = (24 + (i%4)*30) + 'px';
        w.el.style.top  = (52 + Math.floor(i/4)*30 + (i%4)*30) + 'px';
        w.el.style.display = 'flex';
        if(w.dockEl){ w.dockEl.remove(); w.dockEl = null; }
        setTimeout(()=>{ w.el.style.transition=''; }, 300);
        i++;
      });
      return;
    }
    route(g, ctx.getBoundingClientRect());
  }));
});
document.addEventListener('click', e => { if(!e.target.closest('.ctx')) ctx.classList.remove('on'); });

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if(!entered){
    if(booted && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); enterOS(); }
    return;
  }
  if(e.key === 'Escape'){
    if(ctx.classList.contains('on')){ ctx.classList.remove('on'); return; }
    const t = topWindow(); if(t) closeWin(t);
  }
  if(e.key === 't' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); route('terminal'); }
});

/* ---------- plain page ---------- */
function buildPlain(){
  const el = $('#plainContent');
  if(el.dataset.built) return; el.dataset.built = '1';

  const tags = a => '<div class="p-tags">' + a.map(t=>'<span class="p-tag">'+esc(t)+'</span>').join('') + '</div>';
  const links = p => {
    const a = [];
    if(p.play)  a.push('<a href="'+esc(p.play)+'" target="_blank" rel="noopener">Play</a>');
    if(p.video) a.push('<a href="'+esc(p.video)+'" target="_blank" rel="noopener">Watch demo</a>');
    if(p.code)  a.push('<a href="'+esc(p.code)+'" target="_blank" rel="noopener">Source</a>');
    return a.length ? '<div class="p-links">'+a.join('')+'</div>' : '';
  };
  const first = esc(PROFILE.name.split(' ')[0]);
  const rest  = esc(PROFILE.name.split(' ').slice(1).join(' '));

  el.innerHTML =
    '<div class="p-hero">' +
      '<h1>' + first + '<br><em>' + rest + '</em></h1>' +
      '<p class="p-role">' + esc(PROFILE.role) + '. ' + esc(PROFILE.tagline) + '</p>' +
      '<div class="p-links">' +
        '<a href="mailto:'+esc(PROFILE.email)+'">Email</a>' +
        '<a href="'+esc(PROFILE.linkedin)+'" target="_blank" rel="noopener">LinkedIn</a>' +
        '<a href="'+esc(PROFILE.github)+'" target="_blank" rel="noopener">GitHub</a>' +
        '<a href="'+esc(PROFILE.resume)+'" download>Resume</a>' +
      '</div>' +
      '<div class="p-stats">' +
        '<div class="p-stat"><b>'+PROJECTS.length+'</b><span>projects</span></div>' +
        '<div class="p-stat"><b>'+EXPERIENCE.length+'</b><span>roles</span></div>' +
        '<div class="p-stat"><b>'+SKILLS[0].items.length+'</b><span>languages</span></div>' +
      '</div>' +
    '</div>' +

    '<h2>About</h2>' + PROFILE.about.map(t=>'<p>'+esc(t)+'</p>').join('') +

    '<h2>Education</h2>' +
      '<div class="p-card"><h3>'+esc(EDUCATION.program)+'</h3>' +
      '<div class="p-meta">'+esc(EDUCATION.school)+' · '+esc(EDUCATION.dates)+'</div>' +
      '<p>'+esc(EDUCATION.note)+'</p>' + tags(EDUCATION.courses) + '</div>' +

    '<h2>Experience</h2>' +
    EXPERIENCE.map(r =>
      '<div class="p-card"><h3>'+esc(r.title)+'</h3>' +
      '<div class="p-meta">'+esc(r.company)+' · '+esc(r.dates)+'</div>' +
      '<p>'+esc(r.highlight)+'</p>' + tags(r.tech) +
      (r.links ? '<div class="p-links">' + r.links.map(l =>
        '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>').join('') + '</div>' : '') +
      '</div>').join('') +

    FOLDERS.filter(f=>f.kind==='projects').map(f => {
      const list = PROJECTS.filter(p=>p.folder===f.id);
      if(!list.length) return '';
      return '<h2>'+esc(f.name)+'</h2>' + list.map(p =>
        '<div class="p-card"><h3>'+esc(p.name)+'</h3>' +
        '<div class="p-meta">'+esc(p.blurb)+'</div>' +
        '<p>'+esc(p.body)+'</p>' + tags(p.tech) + links(p) + '</div>').join('');
    }).join('') +

    '<h2>Skills</h2>' +
    SKILLS.map(g => '<div class="p-card"><h3>'+esc(g.group)+'</h3>' + tags(g.items) + '</div>').join('') +

    '<h2>Contact</h2>' +
      '<p>Open to co-op and internship terms. The fastest route is email, at ' +
      '<a href="mailto:'+esc(PROFILE.email)+'" style="color:var(--pblue)">'+esc(PROFILE.email)+'</a>' +
      '. You can also leave a message here.</p>' +
      '<div class="p-form">' + formHTML('p') + '</div>' +

    '<p class="p-foot">' + esc(PROFILE.name) + ' · ' + esc(PROFILE.phone) + '</p>';

  bindForm(el);
}

/* ---------- switching views, and switching off ---------- */
function showPlain(){
  buildPlain();
  os.style.display = 'none';
  $('#plain').classList.add('on');
  $('#segDesk').classList.remove('on');
  $('#segPage').classList.add('on');
  document.body.style.overflow = '';
  window.scrollTo(0,0);
}
function showDesktop(){
  $('#plain').classList.remove('on');
  os.style.display = 'flex';
  $('#segPage').classList.remove('on');
  $('#segDesk').classList.add('on');
  document.body.style.overflow = 'hidden';
}
$('#segPage').addEventListener('click', showPlain);
$('#segDesk').addEventListener('click', showDesktop);
$('#toOS').addEventListener('click', showDesktop);

/* power button: close the desktop and let the lid shut again */
function shutDown(){
  [...openWins.values()].forEach(w => { w.el.remove(); openWins.delete(w.id); });
  dock.innerHTML = '';
  ctx.classList.remove('on');
  os.classList.remove('live');
  setTimeout(()=>{
    os.classList.remove('mounted');
    os.style.display = '';
    $('#plain').classList.remove('on');

    screen.classList.add('dark');
    bootEl.classList.remove('on');
    bootEl.innerHTML = '';
    prompt.classList.remove('on');
    flash.classList.remove('fire');
    booted = false;

    stage.style.display = '';
    scene.style.opacity = '1';
    document.querySelector('.brandline').style.opacity = '1';
    laptop.style.transform = 'rotateX(3deg) translateY(16%)';
    document.body.style.overflow = '';
    entered = false;

    $('#segDesk').classList.add('on');
    $('#segPage').classList.remove('on');
    window.scrollTo({ top:0, behavior: reduced ? 'auto' : 'smooth' });
  }, 420);
}
$('#powerBtn').addEventListener('click', shutDown);
document.querySelector('.menubar').querySelectorAll('[data-open]').forEach(b =>
  b.addEventListener('click', ()=>route(b.dataset.open, b.getBoundingClientRect())));

if(window.matchMedia('(max-width:820px)').matches){
  buildPlain();
  $('#toOS').style.display = 'none';
  document.body.style.overflow = '';
}
})();
</script>
